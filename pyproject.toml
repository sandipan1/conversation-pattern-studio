[project]
name = "conversation-pattern-studio"
version = "0.1.0"
description = "Explore recurring needs and themes in conversation datasets"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "numpy>=1.26",
  "openai>=1.50",
  "pydantic>=2.8",
  "python-dotenv>=1.0",
  "scikit-learn>=1.4",
  "typer>=0.12",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
hdbscan = ["hdbscan>=0.8.40"]
projection = ["umap-learn>=0.5.7"]
parquet = ["pyarrow>=16"]
huggingface = ["datasets>=3.0"]
local-embeddings = ["sentence-transformers>=3.0"]
cohere = ["cohere>=5.0"]
sql = ["sqlalchemy>=2.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.8"]

[project.scripts]
pattern-studio = "pattern_studio.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pattern_studio"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
